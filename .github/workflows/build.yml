name: Build OV3660 ESP32-S3 exFAT firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - 'prepare_exfat_component.sh'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build firmware with original verified toolchain sequence
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: '.'
          command: >-
            rm -rf /tmp/esp32-arduino-lib-builder &&
            git clone --depth 1 https://github.com/espressif/esp32-arduino-lib-builder.git /tmp/esp32-arduino-lib-builder &&
            mkdir -p components &&
            cp -a /tmp/esp32-arduino-lib-builder/components/arduino_tinyusb components/arduino_tinyusb &&
            git clone --depth 1 https://github.com/hathach/tinyusb.git components/arduino_tinyusb/tinyusb &&
            bash prepare_exfat_component.sh &&
            idf.py set-target esp32s3 &&
            idf.py build &&
            esptool.py --chip esp32s3 merge_bin
            -o build/ESP32_Cam_HD_FULL_exFAT_MERGED.bin
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/esp32_cam_hd_full_exfat.bin
      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p artifact
          cp build/ESP32_Cam_HD_FULL_exFAT_MERGED.bin artifact/
          cp build/esp32_cam_hd_full_exfat.bin artifact/
          cp build/bootloader/bootloader.bin artifact/
          cp build/partition_table/partition-table.bin artifact/
          cp build/flash_args artifact/ 2>/dev/null || true
          printf '%s\n' 'ESP32-S3 N16R8 OV3660 dual-sensor firmware' 'ESP-IDF 5.5.5 / Arduino-ESP32 3.3.12' 'Green LED GPIO41; Blue LED GPIO42' 'Flash merged BIN at 0x0 via USB-UART' > artifact/FLASH_INFO.txt
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OV3660-GPIO41-42-Firmware
          path: artifact/
          if-no-files-found: error
